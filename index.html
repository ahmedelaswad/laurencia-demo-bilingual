<html lang="en">
<head>

<title>Omani Seaweed Database</title>
<meta name="description" content="Bilingual (English/Arabic) demonstration of the Omani Seaweed Database for the genus Laurencia (HMTF 2027 proposal).">
<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f1f5f6;--sf:#fff;--ink:#112027;--ink2:#46585f;--mu:#6d8088;--ln:#d9e2e5;--ac:#a3245a;--acs:#f7e4ec;--ok:#11733a;--wn:#946000;--cr:#b8342b;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#7a8c2a;--c7:#6250d6;--c8:#e34948;--sea:#dbe9ed;--land:#fbfcfb;--f:"Inter","Cairo",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1519;--sf:#142229;--ink:#e3ebed;--ink2:#a6b6bc;--mu:#7f9299;--ln:#263a43;--ac:#e8719f;--acs:#3a1c29;--ok:#45c46d;--wn:#e5a83a;--cr:#f07164;--sea:#0f2730;--land:#1d313a;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0c1519;--sf:#142229;--ink:#e3ebed;--ink2:#a6b6bc;--mu:#7f9299;--ln:#263a43;--ac:#e8719f;--acs:#3a1c29;--ok:#45c46d;--wn:#e5a83a;--cr:#f07164;--sea:#0f2730;--land:#1d313a;color-scheme:dark}
html,body{height:100%}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
aside{background:var(--sf);border-inline-end:1px solid var(--ln);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:700;font-size:17px;display:flex;gap:8px;align-items:center;margin-bottom:4px}.logo b{color:var(--ac)}.sub{font-size:11px;color:var(--mu);margin-bottom:16px}
nav button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:start;color:var(--ink2);font-weight:500}
nav button:hover{background:var(--bg)}nav button.on{background:var(--acs);color:var(--ac);font-weight:600}
.tools{display:flex;gap:6px;margin-top:14px}.tools button{flex:1;border:1px solid var(--ln);background:var(--bg);border-radius:8px;padding:7px}
main{padding:20px clamp(14px,3vw,32px);min-width:0}
h1{font-size:22px;margin:0 0 2px}h2{font-size:15px;margin:0 0 10px}.mu{color:var(--mu)}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.srch{flex:1 1 240px;max-width:360px;padding:9px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;min-width:0}
.kpi{font-size:28px;font-weight:700;line-height:1.1}.kpi small{display:block;font-size:12px;font-weight:500;color:var(--mu);margin-top:4px}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12.5px;cursor:pointer}.bar>span:first-child{width:36%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:10px;border-radius:5px;background:var(--ac);min-width:3px;transition:width .5s}.bar em{font-style:normal;color:var(--mu);font-size:12px}
.tr{flex:1;background:var(--bg);border-radius:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:4px 11px;font-size:12.5px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
select{padding:6px 8px;border:1px solid var(--ln);border-radius:8px;background:var(--sf)}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:start;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);padding:6px 8px;cursor:pointer;border-bottom:1px solid var(--ln);white-space:nowrap}td{padding:7px 8px;border-bottom:1px solid var(--ln)}tr:hover td{background:var(--bg)}
.sc{overflow-x:auto}.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;background:var(--acs);color:var(--ac);font-weight:600}.tag.ok{background:#e1f1e6;color:#11733a}.tag.wn{background:#fbeed2;color:#946000}.tag.cr{background:#f8e1de;color:#b8342b}
.sp{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.sp .card{cursor:pointer;transition:transform .15s,box-shadow .15s}.sp .card:hover{transform:translateY(-2px);box-shadow:0 8px 20px -10px rgba(0,0,0,.4)}
.sp i.bn{font-style:italic;font-weight:600}
svg text{font-family:var(--f)}
.map{width:100%;height:auto;background:var(--sea);border-radius:10px}.dot{cursor:pointer;transition:r .15s}.dot:hover{stroke:var(--ink);stroke-width:2}
.dr{position:fixed;inset-block:0;inset-inline-end:0;width:min(440px,100%);background:var(--sf);border-inline-start:1px solid var(--ln);box-shadow:-10px 0 30px -12px rgba(0,0,0,.4);z-index:40;overflow:auto;padding:18px;animation:in .2s}
@keyframes in{from{transform:translateX(30px);opacity:0}}[dir=rtl] .dr{animation-name:inr}@keyframes inr{from{transform:translateX(-30px);opacity:0}}
.x{float:inline-end;border:0;background:var(--bg);border-radius:8px;padding:4px 10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px;margin:10px 0}.kv dt{color:var(--mu)}.kv dd{margin:0}
.seq{font:11px/1.5 ui-monospace,monospace;word-break:break-all;background:var(--bg);padding:8px;border-radius:8px}
.chat{position:fixed;inset-block-end:16px;inset-inline-end:16px;z-index:30}
.fab{width:54px;height:54px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:22px;box-shadow:0 8px 20px -6px rgba(0,0,0,.5)}
.cb{width:min(380px,calc(100vw - 24px));height:min(540px,75vh);background:var(--sf);border:1px solid var(--ln);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);overflow:hidden}
.cbh{background:var(--ac);color:#fff;padding:10px 14px;font-weight:600;display:flex;justify-content:space-between}.cbh button{background:none;border:0;color:#fff;font-size:18px}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.m{max-width:88%;padding:8px 11px;border-radius:12px;background:var(--bg);white-space:pre-wrap}.m.u{align-self:flex-end;background:var(--ac);color:#fff}
.sg{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}.sg button{font-size:12px;border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:3px 10px}
.cin{display:flex;gap:6px;padding:10px;border-top:1px solid var(--ln)}.cin input{flex:1;border:1px solid var(--ln);border-radius:10px;padding:8px 10px;background:var(--bg)}.cin button{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:0 14px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:7px;font-size:12px;z-index:50}
.nb{display:none}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}nav{display:flex;overflow:auto;flex:1 1 100%}nav button{width:auto;white-space:nowrap}.sub{display:none}.tools{margin:0}}
:root{--land2:#e7ece8;--okb:#e1f1e6;--wnb:#fbeed2;--crb:#f8e1de;--m1:#f7eef2;--m2:#ecc6d6;--m3:#d98aab}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--land2:#16252c;--okb:#11301c;--wnb:#33270d;--crb:#3b1714;--m1:#21181d;--m2:#4a2236;--m3:#7a2f52}}
:root[data-theme=dark]{--land2:#16252c;--okb:#11301c;--wnb:#33270d;--crb:#3b1714;--m1:#21181d;--m2:#4a2236;--m3:#7a2f52}
[hidden]{display:none!important}
img{max-width:100%}
i[dir=ltr]{unicode-bidi:isolate}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.wn{background:var(--wnb);color:var(--wn)}.tag.cr{background:var(--crb);color:var(--cr)}.tag.pl{background:var(--bg);color:var(--ink2)}
.notice{font-size:12.5px;color:var(--ink2);background:var(--acs);border-radius:10px;padding:9px 12px;margin-bottom:14px}
.note{display:flex;gap:8px;padding:9px 11px;border-radius:10px;font-size:13px;margin:8px 0;align-items:flex-start}.note b{flex:none}
.note.ok{background:var(--okb)}.note.wn{background:var(--wnb)}.note.cr{background:var(--crb)}.note.in{background:var(--bg)}
.ph{background:var(--bg);overflow:hidden;position:relative}.ph img{display:block;width:100%;height:100%;object-fit:cover}
.noph{display:grid;place-items:center;text-align:center;padding:10px;color:var(--mu);font-size:12px;background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 8px,var(--sf) 8px,var(--sf) 16px)}
.sp .card{padding:0;overflow:hidden;display:flex;flex-direction:column}.sp .card .bd{padding:12px 14px 14px}
.cover{aspect-ratio:4/3;width:100%}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.tri .ph{height:100%}
.lv{position:absolute;inset-inline-start:6px;top:6px;background:rgba(10,20,24,.72);color:#fff;font-size:11px;padding:1px 7px;border-radius:5px}
.feat{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:center;margin-top:14px}.feat .tri{height:230px;border-radius:10px;overflow:hidden}
.feat h2{font-size:19px;margin:4px 0 8px}.feat p{margin:0 0 10px;color:var(--ink2)}
.eyb{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:6px 12px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;gap:6px;align-items:center;font-size:13px}.btn:hover{border-color:var(--ac)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gal .main{height:300px;border-radius:10px}.gal .main img{object-fit:contain}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.lvls button{border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:4px;text-align:start;font-size:11.5px;min-width:0}.lvls button.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.lvls .ph{height:56px;margin-bottom:3px;border-radius:5px}
.credit{font-size:11.5px;color:var(--mu);margin:6px 0 12px}
.dr h2{margin-top:16px}.dr .tri{height:150px;border-radius:10px;overflow:hidden;margin:10px 0 0}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,330px);gap:14px;align-items:start}
.mapwrap{margin-inline:auto;width:100%}
.slist{max-height:60vh;overflow:auto}.slist button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:7px 4px;border-bottom:1px solid var(--ln);text-align:start;gap:8px}.slist button:hover{background:var(--bg)}
.mx{width:auto;border-collapse:separate;border-spacing:2px}.mx th,.mx td{padding:4px 6px;font-size:11.5px;text-transform:none;letter-spacing:0;border:0;text-align:center;white-space:nowrap;cursor:default}.mx td{min-width:46px;border-radius:4px}
.mx td.b1{background:var(--m1)}.mx td.b2{background:var(--m2)}.mx td.b3{background:var(--m3);font-weight:600}.mx td.self{background:var(--bg);color:var(--mu)}.mx td.hl{outline:2px solid var(--cr);outline-offset:-2px}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}.lg i{display:inline-block;width:13px;height:11px;border-radius:2px;vertical-align:-1px;margin-inline-end:5px}
.seqbox{width:100%;min-height:96px;font:12px/1.5 ui-monospace,monospace;border:1px solid var(--ln);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink);resize:vertical;direction:ltr}
.smp{display:flex;flex-direction:column;gap:6px;margin-top:8px}.smp button{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:7px 10px;text-align:start}.smp button:hover{border-color:var(--ac)}.smp small{display:block;color:var(--mu);font-size:11.5px}
.hit{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.2fr) 56px;gap:8px;align-items:center;font-size:12.5px;width:100%;border:0;background:none;padding:3px 0;text-align:start}.hit:hover b{color:var(--ac)}.hit .tr{height:8px}.hit .tr i{height:8px}
.hit small{display:block;color:var(--mu);font-size:11px}
.alt{display:block;margin-top:12px;font-size:12px;color:var(--ac);text-decoration:none;border:1px solid var(--ln);border-radius:8px;padding:7px 9px;text-align:center}.alt:hover{border-color:var(--ac)}
.as{display:block;font-size:11px;color:var(--mu)}
.kv dd{overflow-wrap:anywhere}
.gaps{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.ltr{direction:ltr;unicode-bidi:isolate}
@media(max-width:980px){.mapgrid{grid-template-columns:1fr}}
@media(max-width:900px){.feat{grid-template-columns:1fr}.feat .tri{height:190px}}
@media(max-width:760px){.alt{margin:0;padding:5px 8px}.gal .main{height:240px}}
.bar>span:first-child i{display:inline;height:auto;background:none!important;border-radius:0;min-width:0;font-style:italic;transition:none}
</style>
</head>

<script type="application/json" id="db">{"species":[{"code":"LDEN","genus":"Laurencia","epithet":"dendroidea","authority":"J.Agardh","featured":true,"status":"confirmed","statusLabel":"Confirmed in Oman · voucher + DNA","synonyms":[{"name":"Laurencia majuscula (Harvey) A.H.S.Lucas","note":"Treated here as a synonym (curator decision). Ten Omani herbarium records were filed under this name. The GBIF backbone also places it under L. dendroidea.","note_ar":"يُعامل هنا مرادفاً (قرار أمين المجموعة). سُجّلت عشرة سجلات معشبية عُمانية تحت هذا الاسم، ويضعه التصنيف المرجعي لـ GBIF أيضاً تحت L. dendroidea."}],"description":"Omani material (SW-R1, Al-Sawadi): a highly branched thallus forming bushes on low subtidal rock at 2–3 m depth. Branchlets are cylindrical with dense ramification, and the terminal branchlets have blunt apices.","descSource":"Elaswad et al. 2026, Phycology 6: 90 (Figure 1)","habitat":"Low subtidal rock at 2–3 m (Al-Sawadi). Older Omani records come from Daymaniyat Islands, Sur, Barr al Hikman, Sadh and Mirbat, including drift material.","photos":[{"k":"LDEN_A","level":"Whole thallus","cap":"Habit of the dried specimen, with ruler (cm).","level_ar":"المشرة كاملة","cap_ar":"هيئة العينة المجففة مع مسطرة (سم)."},{"k":"LDEN_B","level":"Dissecting microscope","cap":"Cylindrical branchlets and dense ramification. Scale bar 2 mm.","level_ar":"المجهر التشريحي","cap_ar":"فريعات أسطوانية وتفرع كثيف. مقياس الرسم 2 مم."},{"k":"LDEN_C","level":"Higher magnification","cap":"Terminal branchlets with blunt apices. Scale bar 500 µm.","level_ar":"تكبير أعلى","cap_ar":"فريعات طرفية ذات قمم غير حادة. مقياس الرسم 500 ميكرومتر."}],"photoCredit":"Elaswad et al. (2026) Phycology 6: 90, Figure 1 · CC BY licence · specimen SW-R1, Al-Sawadi, Oman","chem":[{"name":"Elatol","cls":"Halogenated sesquiterpene","activity":"Major compound in one Brazilian population; inhibited photosynthesis (allelopathic and autotoxic). Antiherbivory and antifouling roles reported.","ref":"Sudatti et al. 2020, Front. Plant Sci. 11: 347","cls_ar":"سيسكويتربين مهلجن","activity_ar":"المركب الرئيسي في إحدى العشائر البرازيلية؛ ثبّط البناء الضوئي (تأثير أليلوباثي وسمّية ذاتية). وذُكرت له أدوار في مقاومة الرعي ومنع الحشف الحيوي."},{"name":"Obtusol","cls":"Halogenated sesquiterpene","activity":"Major compound in a second Brazilian population; no photosynthetic inhibition at the doses tested.","ref":"Sudatti et al. 2020, Front. Plant Sci. 11: 347","cls_ar":"سيسكويتربين مهلجن","activity_ar":"المركب الرئيسي في عشيرة برازيلية ثانية؛ لم يثبّط البناء الضوئي عند الجرعات المختبرة."}],"chemNote":"Literature data from Brazilian populations. No chemistry yet from Omani material.","statusLabel_ar":"مؤكد في عُمان · عينة مرجعية + حمض نووي","description_ar":"عينة عُمانية (SW-R1، السوادي): مشرة (ثالوس) كثيرة التفرع تكوّن شجيرات على الصخور في المنطقة تحت المدّية السفلى على عمق 2–3 م. الفريعات أسطوانية كثيفة التفرع، والفريعات الطرفية ذات قمم غير حادة.","habitat_ar":"صخور المنطقة تحت المدّية السفلى على عمق 2–3 م (السوادي). وتأتي السجلات العُمانية الأقدم من جزر الديمانيات وصور وبر الحكمان وسدح ومرباط، ومنها مواد منجرفة.","photoCredit_ar":"Elaswad et al. (2026) Phycology 6: 90، الشكل 1 · ترخيص CC BY · العينة SW-R1، السوادي، عُمان","chemNote_ar":"بيانات منشورة من عشائر برازيلية. لا توجد بعد بيانات كيميائية من مواد عُمانية."},{"code":"LOBT","genus":"Laurencia","epithet":"obtusa","authority":"(Hudson) J.V.Lamouroux","status":"herbarium","statusLabel":"Herbarium record only","conflict":"The GBIF taxonomic backbone files this name under L. dendroidea. The database keeps it separate until the taxonomist decides.","description":"Type species of the genus Laurencia. A description from Omani material has not been compiled yet.","descSource":"","habitat":"One Omani specimen, from Mirbat, Dhofar (Schils et al., 28 Sep 2003).","photos":[{"k":"LOBT","level":"In situ","cap":"Underwater photograph (not Omani material).","level_ar":"في موطنه","cap_ar":"صورة تحت الماء (ليست من مواد عُمانية)."}],"photoCredit":"Al <div class="card sc"><h2>${t('mx')}</h2><table class="mx"><tr><th></th>${mx.order.map(id=>`<th>${lab(id)}</th>`).join('')}</tr>${mx.order.map((a,i)=>`<tr><th style="text-align:start">${lab(a)}</th>${mx.cells[i].map((cl,j)=>{if(i===j)return '<td class="self">·</td>';const p=cl[0],hl=(a==='SW-R1-rbcL'&&mx.order[j]==='KX146184')||(a==='KX146184'&&mx.order[j]==='SW-R1-rbcL');return `<td class="${bin(p)}${hl?' hl':''}" title="${p==null?'':p+'% / '+cl[1]+' bp'}">${p==null?'—':nf(+p.toFixed(1))}</td>`}).join('')}</tr>`).join('')}</table><div class="lg"><span><i style="background:var(--m3)"></i>${t('l3')}</span><span><i style="background:var(--m2)"></i>${t('l2')}</span><span><i style="background:var(--m1);border:1px solid var(--ln)"></i>${t('l1')}</span><span>${t('l0')}</span></div><p class="mu" style="font-size:12px;margin:8px 0 0">${sci(t('mxNote'))}</p></div>
<div class="card sc" style="grid-column:1/-1"><h2>${sci(t('ext'))}</h2><div class="mu" style="font-size:12px;margin:-6px 0 8px" dir="ltr">${t('extSrc')}</div><table><tr><th>${t('proto')}</th><th>${t('conc')}</th><th>A260/280</th><th>${t('yld')}</th><th>PCR 18S</th><th>PCR rbcL</th><th>${t('seq18')}</th><th>${t('seqR')}</th><th>${t('time')}</th><th>${t('cost')}</th></tr>${X2.rows.map(r=>`<tr><td><b dir="ltr">${esc(r.m)}</b></td><td class="ltr">${r.conc}</td><td class="ltr">${r.pur}</td><td class="ltr">${r.yld}</td>${[r.pcr18,r.pcrR,r.seq18,r.seqR].map(x=>`<td><div class="bar" style="margin:0;cursor:default"><span class="tr" style="min-width:44px"><i style="width:${x*10}%;background:var(--c3)"></i></span><em>${nf(x)}/${nf(10)}</em></div></td>`).join('')}<td>${nf(r.time)}</td><td>${nf(r.cost)}</td></tr>`).join('')}</table><p class="mu" style="font-size:12px;margin:8px 0 0">${t('extNote')}</p></div>
<div class="card sc" style="grid-column:1/-1"><h2>${t('seqs')}</h2><table><tr><th>${t('acc')}</th><th>${t('species')}</th><th>${t('marker')}</th><th>${t('bp')}</th><th>${t('voucher')}</th><th>${t('origin')}</th><th>${t('src')}</th><th>${t('quality')}</th></tr>${D.seqs.map(q=>`<tr data-q="${esc(q.id)}" style="cursor:pointer" tabindex="0"><td class="ltr" style="white-space:nowrap;text-align:start">${esc(q.acc||t('unpub'))}</td><td>${nm(SC[q.sp])}${q.asName?`<span class="as">${t('filedAs')} <i dir="ltr">${esc(q.asName)}</i></span>`:''}</td><td>${esc(q.marker)}</td><td>${nf(q.len)}</td><td class="ltr" style="text-align:start">${esc(q.voucher)}</td><td>${q.oman?'<b>'+t('oman')+'</b>':whereQ(q)}</td><td style="min-width:150px">${sci(X(q,'ref'))}</td><td>${X(q,'quality').length?X(q,'quality').map(x=>`<span class="tag wn">${esc(x.split(/[;؛]/)[0])}</span>`).join(' '):`<span class="tag ok">${t('ok')}</span>`}</td></tr>`).join('')}</table></div></div>`;
const showR=()=>{$('#idr').innerHTML=idHTML(IDR);$('#idr').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>seqDrawer(b.dataset.q))};showR();
$('#idb').onclick=()=>{IDQ=$('#sq').value;IDR=identify(IDQ,null);showR()};v.querySelectorAll('[data-sm]').forEach(b=>b.onclick=()=>{const q=SQ[D.samples[+b.dataset.sm].acc];runId(q);$('#sq').value=IDQ;showR()});
v.querySelectorAll('tr[data-q]').forEach(tr=>{tr.onclick=()=>seqDrawer(tr.dataset.q);tr.onkeydown=e=>{if(e.key==='Enter')seqDrawer(tr.dataset.q)}})}

/* ---------- chemistry ---------- */
function chem(v){const a=SP.filter(s=>s.chem.length).map(s=>[s.code,s.chem.length,nm(s),s.color]),all=SP.flatMap(s=>s.chem.map(c=>({...c,sp:s.code})));
v.innerHTML=head(t('chem'))+`<div class="grid g2"><div class="card"><h2>${t('cs')}</h2>${bars(a)}<p class="mu" style="font-size:12px;margin:10px 0 0">${L==='ar'?'لا توجد بعد بيانات كيميائية من مواد عُمانية؛ المركبات المعروضة مأخوذة من الأدبيات العلمية.':'No chemistry yet from Omani material; the compounds shown come from the literature.'}</p></div><div class="card sc"><table><tr><th>${t('cmp')}</th><th>${t('cls')}</th><th>${t('act')}</th><th>${t('ref')}</th><th>${t('species')}</th></tr>${all.map(c=>`<tr><td><b dir="ltr">${esc(c.name)}</b></td><td>${esc(X(c,'cls'))}</td><td>${sci(X(c,'activity'))}</td><td class="ltr" style="text-align:start;min-width:140px">${esc(c.ref)}</td><td>${nm(SC[c.sp])}</td></tr>`).join('')}</table></div></div>`;
v.querySelectorAll('.bar').forEach(b=>b.onclick=()=>drawer(b.dataset.k))}

/* ---------- chatbot: local, bilingual, answers from the real dataset ---------- */
const AR={'ظفار':'Dhofar','مسقط':'Muscat','مسندم':'Musandam','الوسطى':'Al Wusta','الشرقية':'South Al Sharqiyah','الباطنة':'South Al Batinah'};
const SYN={majuscula:'LDEN',papillosa:'PPER',papillosus:'PPER',intermedia:'PINT',perforata:'PPER'};
const KW={names:/synonym|name change|renam|names?\b|مرادف|أسماء|اسم/i,chem:/compound|chem|activity|bioactiv|مركب|كيمي|نشاط/i,conflict:/conflict|matrix|identity|gap|distance|wynr|تعارض|مصفوفة|فجوة|تطابق/i,ext:/extract|ctab|hotshot|dnazol|kit|pcr|استخلاص/i,dna:/dna|barcode|rbcl|coi|18s|sequence|accession|genbank|حمض|باركود|جين|تسلسل/i,photo:/photo|picture|image|صور|صورة/i,depth:/depth|deep|عمق|أعمق/i,status:/status|verif|flag|حالة|تحقق/i,inst:/herbari|museum|held|collection|meise|michigan|london|معشب|متحف|تُحفظ|تحفظ|حفظ/i,count:/how many|count|number|total|كم|عدد/i,site:/site|location|where|موقع|مواقع|أين/i,year:/year|oldest|newest|recent|سنة|عام|أقدم|أحدث/i,list:/species|types|أنواع|نوع/i};
function ans(q){const A=L==='ar',lq=q.toLowerCase();let sp=SP.find(s=>s.code!=='LSPP'&&(lq.includes(s.epithet.toLowerCase())||lq.includes(s.epithet.slice(0,6).toLowerCase())));if(!sp){const k=Object.keys(SYN).find(x=>lq.includes(x));if(k)sp=SC[SYN[k]]}
const gov=Object.entries(AR).find(([k])=>q.includes(k))?.[1]||GOVS.find(g=>lq.includes(g.toLowerCase())||lq.includes(g.split(' ').pop().toLowerCase())),yr=(q.match(/(19|20)\d\d/)||[])[0];
let rs=R.filter(r=>(!sp||r.sp===sp.code)&&(!gov||r.gov===gov)&&(!yr||(r.date||'').startsWith(yr)));const sn=sp?sp.n:'',RC=n=>A?`عدد السجلات: ${n}`:`${n} records`;
if(KW.names.test(q)&&!KW.chem.test(q))return(A?'تغييرات الأسماء:\n':'Name changes:\n')+['• Laurencia majuscula → Laurencia dendroidea (10)','• Laurencia papillosa, Chondrophycus papillosus → Palisada perforata (5)','• Laurencia intermedia → Palisada intermedia (1)'].join('\n')+(A?'\n\nأسماء قيد المراجعة (يضعها GBIF تحت L. dendroidea): L. obtusa، L. filiformis، L. heteroclada.':'\n\nNames to review (GBIF files them under L. dendroidea): L. obtusa, L. filiformis, L. heteroclada.');
if(KW.chem.test(q)){const l=(sp?[sp]:SP).flatMap(s=>s.chem.map(c=>`• ${c.name} (${X(c,'cls')})${sp?'':' ['+s.n+']'} — ${c.ref}`));return l.length?(A?`المركبات${sn?' في '+sn:''} (من الأدبيات):\n`:`Compounds${sn?' in '+sn:''} (from the literature):\n`)+l.join('\n'):t('nochem')}
if(KW.conflict.test(q))return A?'مصفوفة rbcL:\n• SW-R1 (السوادي) مقابل L. dendroidea الكولومبية: 99.3%\n• WYNR154 (ظفار، مسجلة باسم L. majuscula) مقابل SW-R1: 96.3% (اختلاف 3.75%)\n• تسلسلات L. obtusa المتوسطية والمصرية: 98–100%\nقد تمثّل WYNR154 سلالة مستقلة؛ يُحال الأمر إلى عالم التصنيف.':'rbcL identity:\n• SW-R1 (Al-Sawadi) vs Colombian L. dendroidea: 99.3%\n• WYNR154 (Dhofar, filed as L. majuscula) vs SW-R1: 96.3% (3.75% different)\n• L. obtusa, Mediterranean vs Egyptian: 98–100%\nWYNR154 may be a separate lineage; the taxonomist will review it.';
if(KW.ext.test(q))return(A?'استخلاص الحمض النووي من L. dendroidea (ن = 10):\n':'DNA extraction from L. dendroidea (n = 10):\n')+D.extraction.rows.map(x=>`• ${x.m}: PCR rbcL ${x.pcrR}/10, 18S ${x.pcr18}/10 · ${x.time} min · $${x.cost}`).join('\n');
if(KW.photo.test(q)){const w=SP.filter(s=>s.photos.length);return(A?'الأنواع التي لها صور:\n':'Species with photographs:\n')+w.map(s=>`• ${s.full}: ${s.photos.length} (${s.code==='LDEN'?(A?'عينة عُمانية SW-R1':'Omani specimen SW-R1'):'AlgaeBase'})`).join('\n')}
if(KW.dna.test(q)){const c=cnt(D.seqs,x=>x.sp).filter(([k])=>!sp||k===sp.code);return(A?`تسلسلات الباركود (${D.seqs.length}؛ منها ${D.seqs.filter(x=>x.oman).length} من مواد عُمانية):\n`:`DNA barcodes (${D.seqs.length}; ${D.seqs.filter(x=>x.oman).length} from Omani material):\n`)+c.map(([k,n])=>`• ${SC[k].full}: ${n} (${[...new Set(D.seqs.filter(x=>x.sp===k).map(x=>x.marker))].join(', ')})`).join('\n')+(sp&&!c.length?t('noseq'):'')}
if(KW.depth.test(q)){const d=rs.filter(r=>r.depth).sort((a,b)=>b.depth[1]-a.depth[1])[0];return d?`${A?'أعمق سجل':'Deepest record'}: ${d.id} · ${SC[d.sp].n} · ${d.depth[1]} m · ${locOf(d)}`:'—'}
if(KW.inst.test(q))return(A?'أماكن حفظ العينات:\n':'Where the specimens are held:\n')+cnt(rs,r=>r.inst).map(([k,n])=>`• ${X(R.find(r=>r.inst===k),'instName')}: ${n}`).join('\n');
if(KW.status.test(q))return cnt(rs,r=>r.status).map(([k,n])=>`• ${tv('status',k)}: ${n}`).join('\n');
if(KW.year.test(q)&&!yr){const y=cnt(rs.filter(r=>r.date),r=>r.date.slice(0,4)).sort();return y.map(([k,n])=>`${k}: ${n}`).join(' · ')}
if(KW.site.test(q)||gov){const ss=[...new Set(rs.filter(siteOf).map(r=>r.site))].map(id=>X(ST[id],'name'));return `${RC(rs.length)}${gov?' · '+tv('gov',gov):''}${sn?' · '+sn:''}\n`+(ss.length?(A?'المواقع: ':'Sites: ')+ss.join(A?'؛ ':'; '):'')}
if(sp&&!KW.count.test(q)){const n=R.filter(r=>r.sp===sp.code).length,qn=D.seqs.filter(x=>x.sp===sp.code).length;return `${sp.full} ${sp.authority}\n${X(sp,'statusLabel')}\n${X(sp,'description')}\n${A?'السجلات':'Records'}: ${n} · ${A?'التسلسلات':'Sequences'}: ${qn}`}
if(KW.count.test(q)||yr)return `${RC(rs.length)}${sn?' · '+sn:''}${yr?' · '+yr:''}${gov?' · '+tv('gov',gov):''}`;
if(KW.list.test(q))return SP.map(s=>`• ${s.full} — ${X(s,'statusLabel')}`).join('\n');
return t('nores')}
function chatInit(re){const c=$('#chat');if(re&&c.dataset.open!=='1'){c.innerHTML='<button class="fab" aria-label="chat">💬</button>';c.firstChild.onclick=()=>{c.dataset.open='1';chatInit(true)};return}
c.dataset.open='1';c.innerHTML=`<div class="cb"><div class="cbh"><span>🌿 ${t('chat')}</span><button aria-label="close">✕</button></div><div class="msgs" id="ms"></div><div class="sg">${t('try').map(x=>`<button>${esc(x)}</button>`).join('')}</div><form class="cin"><input id="ci" placeholder="${t('ph')}" autocomplete="off" aria-label="${t('ph')}"><button aria-label="send">➤</button></form></div>`;const ms=$('#ms'),add=(x,u)=>{ms.append(h('div',{className:'m'+(u?' u':''),textContent:x}));ms.scrollTop=1e9},go=q=>{if(!q.trim())return;add(q,1);setTimeout(()=>add(ans(q)),250)};add(t('hi'));
c.querySelector('.cbh button').onclick=()=>{c.dataset.open='0';chatInit(true)};c.querySelectorAll('.sg button').forEach(b=>b.onclick=()=>go(b.textContent));c.querySelector('form').onsubmit=e=>{e.preventDefault();const i=$('#ci');go(i.value);i.value=''}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDr()});
setLang(L);
</script>
